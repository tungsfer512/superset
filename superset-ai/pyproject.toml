[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-ai"
version = "0.1.0"
description = "AI sidecar service for Apache Superset: NL Q&A, Text-to-SQL, schema understanding."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["superset_ai*"]

# ---------------------------------------------------------------------------
# Tooling below mirrors Apache Superset's pyproject.toml so the dev experience
# in this sidecar stays as close to Superset as possible.
# ---------------------------------------------------------------------------

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disable_error_code = "annotation-unchecked"

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Superset / Black.
line-length = 88
indent-width = 4

# Runtime is Python 3.11 (Superset Docker base: python:3.11.13-slim-bookworm).
target-version = "py311"

[tool.ruff.lint]
select = [
    "B904",
    "E4",
    "E7",
    "E9",
    "PT009",
    "TRY201",
    "B",
    "C",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "Q",
    "S",
    "T",
    "TID",
    "W",
]

ignore = [
    "S101",
    "PT006",
    "T201",
    "N999",
]
extend-select = ["I"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["superset_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
