#
# Example: run the superset-ai sidecar alongside an existing Superset.
# The sidecar is a SEPARATE process — if it crashes, Superset is unaffected.
# Put both behind one reverse proxy / same domain so the Superset session
# cookie reaches the sidecar (token pass-through -> RBAC/RLS preserved).
services:
  superset-ai:
    build: .
    image: superset-ai:latest
    restart: unless-stopped
    environment:
      # Superset REST API base URL (reachable from this container).
      SUPERSET_AI_SUPERSET_BASE_URL: http://superset:8088
      # Provider: anthropic | openai | gemini (set the matching key).
      SUPERSET_AI_LLM_PROVIDER: ${SUPERSET_AI_LLM_PROVIDER:-anthropic}
      SUPERSET_AI_ANTHROPIC_API_KEY: ${SUPERSET_AI_ANTHROPIC_API_KEY:-}
      SUPERSET_AI_OPENAI_API_KEY: ${SUPERSET_AI_OPENAI_API_KEY:-}
      SUPERSET_AI_GEMINI_API_KEY: ${SUPERSET_AI_GEMINI_API_KEY:-}
      # Browser origin of Superset (for CORS).
      SUPERSET_AI_EXTRA_CORS_ORIGINS: ${SUPERSET_AI_EXTRA_CORS_ORIGINS:-}
      SUPERSET_AI_RATE_LIMIT_PER_MIN: "30"
    ports:
      - "8800:8800"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8800/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Attach to the same network as your Superset stack, e.g.:
    # networks: [superset_default]
# networks:
#   superset_default:
#     external: true
