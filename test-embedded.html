<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            margin: 0;
            padding: 10px 20px;
            font-size: 20px;
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        #error-message {
            flex-shrink: 0;
            margin: 0;
        }

        #dashboard-container {
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            border: none;
            position: relative;
        }

        /* Make the iframe fill the container */
        #dashboard-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: block;
        }

        .loading {
            text-align: center;
            color: #666;
        }

        .error {
            color: red;
            padding: 15px 20px;
            background-color: #ffe6e6;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="error-message"></div>
    <div id="dashboard-container" class="loading">Loading dashboard...</div>

    <script src="https://unpkg.com/@superset-ui/embedded-sdk"></script>
    <script>
        const SUPERSET_URL = 'http://localhost:9000';
        const SUPERSET_ADMIN = 'admin';
        const SUPERSET_PASSWORD = '@Abc123';

        const params = new URLSearchParams(window.location.search);
        const DASHBOARD_ID = params.get("dashboard_id");

        async function login(username, password) {
            const myHeaders = new Headers();
            myHeaders.append("Accept", "application/json");
            myHeaders.append("Content-Type", "application/json");
            const raw = JSON.stringify({
                "password": password,
                "provider": "db",
                "refresh": true,
                "username": username
            });
            const requestOptions = {
                method: "POST",
                body: raw,
                headers: myHeaders,
                redirect: "follow"
            };
            try {
                const response = await fetch(SUPERSET_URL + "/api/v1/security/login", requestOptions);
                const data = await response.json();
                return data.access_token;
            } catch (error) {
                console.error(error);
            }
        }

        async function get_guest_token() {
            const access_token = await login(SUPERSET_ADMIN, SUPERSET_PASSWORD);
            console.log("access_token", access_token);
            const myHeaders = new Headers();
            myHeaders.append("Accept", "application/json");
            myHeaders.append("Content-Type", "application/json");
            myHeaders.append("Authorization", "Bearer " + access_token);

            const raw = JSON.stringify({
                "user": {
                    "username": SUPERSET_ADMIN,
                    "first_name": "",
                    "last_name": ""
                },
                "resources": [
                    {
                        "type": "dashboard",
                        "id": DASHBOARD_ID
                    }
                ],
                "rls": [],
            });

            const requestOptions = {
                method: "POST",
                headers: myHeaders,
                body: raw,
                redirect: "follow"
            };
            const response = await fetch(SUPERSET_URL + "/api/v1/security/guest_token/", requestOptions);
            const data = await response.json();
            console.log("guest_token", data);
            return data.token;
        }

        const container = document.getElementById('dashboard-container');
        const errorDiv = document.getElementById('error-message');
        let currentLocale = null; // tracks locale selected by user

        function showError(message) {
            errorDiv.innerHTML = '<div class="error">Error: ' + message + '</div>';
            container.innerHTML = '';
        }

        async function testConnection() {
            try {
                const response = await fetch(SUPERSET_URL + '/api/v1/security/csrf_token/', {
                    method: 'GET',
                    mode: 'cors'
                });
                console.log('Superset connection test:', response.status, response.statusText);
                if (!response.ok && response.status !== 401) {
                    console.warn('Superset may not be accessible:', response.status);
                }
            } catch (error) {
                console.error('Cannot reach Superset at', SUPERSET_URL, error);
                showError('Cannot connect to Superset at ' + SUPERSET_URL + '. Please check:<br>' +
                    '1. Superset server is running<br>' +
                    '2. The URL is correct<br>' +
                    '3. CORS is enabled in Superset config');
            }
        }

        async function embedDashboard() {
            if (typeof window.supersetEmbeddedSdk === 'undefined') {
                showError('Superset Embedded SDK failed to load. Please check your internet connection.');
                return;
            }

            if (typeof window.supersetEmbeddedSdk.embedDashboard !== 'function') {
                showError('embedDashboard function not found in SDK.');
                return;
            }

            testConnection();

            container.innerHTML = '';

            const guest_token = await get_guest_token();

            const embedConfig = {
                id: DASHBOARD_ID,
                supersetDomain: SUPERSET_URL,
                mountPoint: container,
                fetchGuestToken: () => Promise.resolve(guest_token),
                dashboardUiConfig: {
                    hideTitle: false,
                    hideChartControls: false,
                    urlParams: {
                        "standalone": 1,
                        ...(currentLocale ? { "lang": currentLocale } : {}),
                    },
                },
                width: '100%',
                height: '100%',
            };

            console.log('Embedding dashboard with config:', {
                id: DASHBOARD_ID,
                supersetDomain: SUPERSET_URL,
                guest_token: guest_token,
                dashboardUiConfig: embedConfig.dashboardUiConfig,
            });

            window.supersetEmbeddedSdk.embedDashboard(embedConfig)
                .then((dashboard) => {
                    console.log('Dashboard embedded successfully:', dashboard);
                    setTimeout(() => {
                        const iframe = container.querySelector('iframe');
                        if (iframe) {
                            iframe.style.width = '100%';
                            iframe.style.height = '100%';
                            console.log('Iframe resized to fill container');
                        }
                    }, 100);
                })
                .catch((error) => {
                    console.error('Error embedding dashboard:', error);
                    console.error('Error details:', {
                        message: error.message,
                        stack: error.stack,
                        name: error.name
                    });
                    let errorMsg = 'Failed to embed dashboard: ' + (error.message || 'Unknown error');

                    if (error.message && error.message.includes('CORS')) {
                        errorMsg += '<br><br><strong>CORS Error:</strong> Make sure your Superset config allows requests from this origin.';
                    }
                    if (error.message && error.message.includes('token')) {
                        errorMsg += '<br><br><strong>Token Error:</strong> The guest token may be expired or invalid. Generate a new token.';
                    }
                    if (error.message && error.message.includes('404') || error.message && error.message.includes('Not Found')) {
                        errorMsg += '<br><br><strong>Not Found:</strong> Check that the dashboard ID and Superset URL are correct.';
                    }

                    showError(errorMsg);
                });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(embedDashboard, 100);
            });
        } else {
            setTimeout(embedDashboard, 100);
        }

        // Re-embed when locale changes from inside the iframe
        window.addEventListener('message', (event) => {
            console.log('Received message:', event.data);
            if (event.data && event.data.type === 'superset-locale-changed') {
                console.log('Locale changed to:', event.data.locale, '- re-embedding dashboard...');
                currentLocale = event.data.locale;
                setTimeout(embedDashboard, 100);
            }
        });
    </script>
</body>

</html>
